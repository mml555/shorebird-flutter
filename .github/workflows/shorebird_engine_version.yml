name: shorebird_engine_version

# Fails when bin/internal/engine.version names an engine Shorebird never
# built. bin/flutter downloads its Dart SDK and engine artifacts from
# download.shorebird.dev keyed by that hash, so an unbuilt pin (most often
# upstream's value, carried in by a rebase onto a new upstream tag) turns
# every other job in shorebird_ci red at the download, before a test runs.
# This says so in seconds, by name, instead.
#
# The fix is a `chore: bump engine to <sha>` commit pinning an engine
# _build_engine built: after the post-ship rebase of shorebird/dev, the
# shipped flutter_release/<version>'s engine.version; otherwise the engine
# built from this branch's tip.
#
# A self-built engine (engine-<hash> release in this repository, served to CI
# by .github/actions/selfhost-engine-mirror) also passes, with a warning for
# each host its release has no Dart SDK for.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
  push:
    branches:
      - shorebird/dev
      - flutter_release/**
      - flutter_release_ex/**

permissions:
  contents: read

jobs:
  engine-version:
    name: 🔩 engine.version has Shorebird artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: 📚 Git Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          sparse-checkout: bin/internal/engine.version
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: 🔩 Check download.shorebird.dev serves the pinned engine
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          file=bin/internal/engine.version
          if [ ! -f "$file" ]; then
            echo "::error file=$file::$file is missing, so bin/flutter would fall back to a content-aware hash Shorebird never built. Restore the pin."
            exit 1
          fi
          # Read it as bin/internal/update_engine_version.sh does, so a pin
          # with stray whitespace fails here as it would there.
          engine="$(< "$file")"
          if [[ ! "$engine" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error file=$file::'$engine' is not a full 40-hex engine SHA."
            exit 1
          fi
          missing=0
          # The two Dart SDKs shorebird_ci's runners download first.
          for zip in dart-sdk-linux-x64.zip dart-sdk-darwin-arm64.zip; do
            url="https://download.shorebird.dev/flutter_infra_release/flutter/$engine/$zip"
            status="$(curl -sS -o /dev/null -w '%{http_code}' --head --location --retry 3 "$url")"
            echo "$status $url"
            if [ "$status" != 200 ]; then
              missing=1
            fi
          done
          if [ "$missing" != 0 ] && gh release view "engine-$engine" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            # Self-built: the release must carry the overlay; a host without a
            # Dart SDK in it cannot run bin/flutter, so say which.
            # overlay-<hash>.txt lists overlay-<hash>.tar, so the 600 MB tar
            # is not fetched here.
            assets="$(gh release view "engine-$engine" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[].name')"
            for asset in "overlay-$engine.tar" "overlay-$engine.txt" "experimental_hashes-$engine.map" SHA256SUMS; do
              if ! grep -qx "$asset" <<< "$assets"; then
                echo "::error file=$file::Release engine-$engine has no $asset."
                exit 1
              fi
            done
            listing="$(gh release download "engine-$engine" -R "$GITHUB_REPOSITORY" -p "overlay-$engine.txt" -O -)"
            sdks=0
            for zip in dart-sdk-linux-x64.zip dart-sdk-darwin-arm64.zip; do
              if grep -q "flutter_infra_release/flutter/$engine/$zip\$" <<< "$listing"; then
                echo "self-built engine $engine: $zip in release engine-$engine"
                sdks=$((sdks + 1))
              else
                echo "::warning file=$file::Self-built engine $engine has no $zip, so jobs on that host cannot run bin/flutter."
              fi
            done
            if [ "$sdks" = 0 ]; then
              echo "::error file=$file::Release engine-$engine has no Dart SDK for any host."
              exit 1
            fi
            missing=0
          fi
          if [ "$missing" != 0 ]; then
            echo "::error file=bin/internal/engine.version::Engine $engine has no Shorebird artifacts on download.shorebird.dev, so bin/flutter cannot download its Dart SDK. Pin an engine _build_engine built (a 'chore: bump engine to <sha>' commit); git log -p -- bin/internal/engine.version shows the previous pins."
            exit 1
          fi
